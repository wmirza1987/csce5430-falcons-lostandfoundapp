<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lost and Found for Campus — Phase 1 Demo</title>
<style>
:root {
  --bg: #ffffff;
  --text: #222222;
  --muted: #555555;
  --nav-bg: #ffffff;
  --nav-border: #dddddd;
  --card-bg: #ffffff;
  --card-border: #dddddd;
  --input-border: #bbbbbb;
  --input-bg: #ffffff;
  --button-border: #999999;
  --button-bg: #ffffff;
  --button-hover: #f0f0f0;
  --link: #2f5d9f;
  --error: #b00020;
  --banner-bg: #fff8e1;
  --banner-border: #e0c36a;
  --banner-text: #6b5600;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212;
    --text: #e8e8e8;
    --muted: #aaaaaa;
    --nav-bg: #1b1b1b;
    --nav-border: #333333;
    --card-bg: #1b1b1b;
    --card-border: #333333;
    --input-border: #555555;
    --input-bg: #1b1b1b;
    --button-border: #777777;
    --button-bg: #1b1b1b;
    --button-hover: #2a2a2a;
    --link: #8ab4f8;
    --error: #ff6b6b;
    --banner-bg: #2a2410;
    --banner-border: #5a4a1a;
    --banner-text: #e8d98a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121212;
  --text: #e8e8e8;
  --muted: #aaaaaa;
  --nav-bg: #1b1b1b;
  --nav-border: #333333;
  --card-bg: #1b1b1b;
  --card-border: #333333;
  --input-border: #555555;
  --input-bg: #1b1b1b;
  --button-border: #777777;
  --button-bg: #1b1b1b;
  --button-hover: #2a2a2a;
  --link: #8ab4f8;
  --error: #ff6b6b;
  --banner-bg: #2a2410;
  --banner-border: #5a4a1a;
  --banner-text: #e8d98a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
a { color: var(--link); }
.navbar {
  display: flex; justify-content: space-between; align-items: center;
  background-color: var(--nav-bg); border-bottom: 1px solid var(--nav-border);
  padding: 16px 24px; margin-bottom: 0;
  position: sticky; top: 0; z-index: 5;
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
}
.nav-left, .nav-right { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.navbar a { color: var(--link); text-decoration: none; font-weight: 500; cursor: pointer; }
.navbar a:hover { text-decoration: underline; }
.navbar button { padding: 7px 14px; }
.demo-banner {
  background: var(--banner-bg); border-bottom: 1px solid var(--banner-border);
  color: var(--banner-text); padding: 10px 24px; font-size: 13.5px; text-align: center;
}
.demo-banner a { color: var(--banner-text); text-decoration: underline; }
main, .page-container { width: 90%; max-width: 900px; margin: 0 auto; padding-top: 30px; padding-bottom: 60px; }
h1 { margin-bottom: 24px; }
h2 { margin-top: 0; }
form {
  background-color: var(--card-bg); padding: 24px; border: 1px solid var(--card-border);
  border-radius: 8px; margin-bottom: 24px; max-width: 520px;
}
label { font-weight: 600; display: block; margin-top: 14px; }
label:first-child { margin-top: 0; }
input, select, textarea {
  width: 100%; max-width: 420px; padding: 9px 10px; margin-top: 5px;
  border: 1px solid var(--input-border); border-radius: 4px;
  background: var(--input-bg); color: var(--text); font-family: inherit; font-size: 14px;
}
textarea { min-height: 90px; resize: vertical; }
button {
  border: 1px solid var(--button-border); border-radius: 4px; background-color: var(--button-bg);
  color: var(--text); padding: 8px 14px; font-family: inherit; cursor: pointer; margin-top: 16px; font-size: 14px;
}
button:hover { background-color: var(--button-hover); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.field-error { color: var(--error); font-size: 0.88em; margin: 4px 0 0; }
.form-message { font-weight: 600; margin: 12px 0; }
.form-message.error { color: var(--error); }
.listing-card {
  background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px;
  padding: 20px; margin-bottom: 18px;
}
.listing-images { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.listing-thumbnail { width: 120px; height: 90px; object-fit: cover; border: 1px solid var(--card-border); border-radius: 4px; }
.pagination { margin-top: 20px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
.home-page { text-align: center; padding: 50px 20px; }
.home-page h1 { font-size: 38px; margin-bottom: 16px; }
.home-page p { font-size: 17px; color: var(--muted); max-width: 620px; margin: 0 auto 26px; }
.home-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.helper-text { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
.file-list { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
.badge {
  display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px;
  background: var(--link); color: white; margin-left: 8px; vertical-align: middle;
}
.email-log { background: var(--card-bg); border: 1px dashed var(--card-border); border-radius: 8px; padding: 16px; margin-bottom: 18px; font-size: 13.5px; }
.email-log .entry { border-top: 1px solid var(--card-border); padding: 10px 0; }
.email-log .entry:first-child { border-top: none; }
.email-log code { word-break: break-all; }
.link-button { background: none; border: none; color: var(--link); text-decoration: underline; cursor: pointer; padding: 0; font: inherit; }
table.ref-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
table.ref-table th, table.ref-table td { border: 1px solid var(--card-border); padding: 8px 10px; text-align: left; font-size: 13.5px; }
table.ref-table th { background: var(--card-bg); }
</style>
</head>
<body>
<div id="banner" class="demo-banner"></div>
<nav class="navbar" id="navbar"></nav>
<main class="page-container" id="app"></main>

<script>
/* =========================================================================
   Lost and Found for Campus — Phase 1 interactive demo
   This reproduces the real application's actual validation rules, error
   messages, and workflow exactly as implemented in src/backend and
   src/frontend, entirely in the browser. There is no real server or
   database behind it: "users" and "listings" are stored only in this
   browser's local storage, and "emails" are written to an on screen log
   instead of actually being sent, mirroring the real backend's own
   console-log fallback when no SMTP provider is configured.
   ========================================================================= */

const DB_KEYS = { USERS: "lf_demo_users", LISTINGS: "lf_demo_listings", SESSION: "lf_demo_session", EMAIL_LOG: "lf_demo_email_log", SEEDED: "lf_demo_seeded" };

function loadDB(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch (e) { return fallback; }
}
function saveDB(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }

function uid(prefix) { return prefix + "_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function rawToken() { return Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2, "0")).join(""); }
function escapeHtml(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

/* ---- seed a little sample data on first run, so Browse/Search has content ---- */
function seedIfNeeded() {
  if (loadDB(DB_KEYS.SEEDED, false)) return;
  const owner = uid("user");
  const users = [{
    id: owner, firstName: "Jordan", lastName: "Ellis", email: "jordan.ellis@my.unt.edu",
    password: "Password123", role: "user", isEmailVerified: true,
    emailVerificationToken: null, emailVerificationExpires: null,
    passwordResetToken: null, passwordResetExpires: null,
  }];
  const listings = [
    { id: uid("listing"), type: "found", title: "Black North Face Backpack", category: "Bags",
      description: "Found near the first floor entrance, zipper pull missing.", date: "2026-10-15",
      building: "Willis Library", zone: "", images: [], status: "active", isDeleted: false,
      privateDetails: "Inside pocket has a UNT student ID sticker with initials J.E.", createdBy: owner, createdAt: Date.now() - 86400000 },
    { id: uid("listing"), type: "lost", title: "Lost Calculator (TI-84)", category: "Electronics",
      description: "Left in a study room on the third floor.", date: "2026-10-14",
      building: "Discovery Park", zone: "", images: [], status: "active", isDeleted: false,
      privateDetails: "", createdBy: owner, createdAt: Date.now() - 172800000 },
  ];
  saveDB(DB_KEYS.USERS, users);
  saveDB(DB_KEYS.LISTINGS, listings);
  saveDB(DB_KEYS.EMAIL_LOG, []);
  saveDB(DB_KEYS.SEEDED, true);
}
seedIfNeeded();

/* ---- "backend": reproduces authController.js and listingController.js ---- */
const Backend = {
  logEmail(to, subject, text) {
    const log = loadDB(DB_KEYS.EMAIL_LOG, []);
    log.unshift({ to, subject, text, time: new Date().toLocaleString() });
    saveDB(DB_KEYS.EMAIL_LOG, log.slice(0, 20));
  },

  register({ firstName, lastName, email, password }) {
    if (!firstName || !lastName || !email || !password) return { ok: false, status: 400, message: "All fields are required." };
    const normalizedEmail = String(email).toLowerCase().trim();
    if (!(normalizedEmail.endsWith("@my.unt.edu") || normalizedEmail.endsWith("@unt.edu"))) {
      return { ok: false, status: 400, message: "Please use a valid UNT email address." };
    }
    if (String(password).length < 8) return { ok: false, status: 400, message: "Password must be at least 8 characters." };
    const users = loadDB(DB_KEYS.USERS, []);
    if (users.some(u => u.email === normalizedEmail)) return { ok: false, status: 409, message: "An account with this email already exists." };
    const token = rawToken();
    const user = {
      id: uid("user"), firstName, lastName, email: normalizedEmail, password, role: "user", isEmailVerified: false,
      emailVerificationToken: token, emailVerificationExpires: Date.now() + 24 * 60 * 60 * 1000,
      passwordResetToken: null, passwordResetExpires: null,
    };
    users.push(user);
    saveDB(DB_KEYS.USERS, users);
    this.logEmail(user.email, "Verify your Lost and Found for Campus account",
      `Welcome to Lost and Found for Campus. Please verify your email by opening this link within 24 hours: #/verify-email/${token}`);
    return { ok: true, status: 201, message: "User registered successfully. Please check your email to verify your account." };
  },

  verifyEmail(token) {
    const users = loadDB(DB_KEYS.USERS, []);
    const user = users.find(u => u.emailVerificationToken === token && u.emailVerificationExpires > Date.now());
    if (!user) return { ok: false, status: 400, message: "This verification link is invalid or has expired." };
    user.isEmailVerified = true;
    user.emailVerificationToken = null;
    user.emailVerificationExpires = null;
    saveDB(DB_KEYS.USERS, users);
    return { ok: true, status: 200, message: "Email verified successfully. You can now create listings." };
  },

  login({ email, password }) {
    if (!email || !password) return { ok: false, status: 400, message: "Email and password are required." };
    const users = loadDB(DB_KEYS.USERS, []);
    const user = users.find(u => u.email === String(email).toLowerCase().trim());
    if (!user || user.password !== password) return { ok: false, status: 401, message: "Invalid email or password." };
    saveDB(DB_KEYS.SESSION, { userId: user.id });
    return { ok: true, status: 200, message: "Login successful.", user };
  },

  logout() { saveDB(DB_KEYS.SESSION, null); },

  currentUser() {
    const session = loadDB(DB_KEYS.SESSION, null);
    if (!session) return null;
    const users = loadDB(DB_KEYS.USERS, []);
    return users.find(u => u.id === session.userId) || null;
  },

  forgotPassword({ email }) {
    const neutral = { ok: true, status: 200, message: "If an account exists for this email, a password reset link has been sent." };
    if (!email) return { ok: false, status: 400, message: "An email address is required." };
    const users = loadDB(DB_KEYS.USERS, []);
    const user = users.find(u => u.email === String(email).toLowerCase().trim());
    if (user) {
      const token = rawToken();
      user.passwordResetToken = token;
      user.passwordResetExpires = Date.now() + 60 * 60 * 1000;
      saveDB(DB_KEYS.USERS, users);
      this.logEmail(user.email, "Reset your Lost and Found for Campus password",
        `A password reset was requested for this account. This link expires in 1 hour: #/reset-password/${token}`);
    }
    return neutral;
  },

  resetPassword(token, { password }) {
    if (!password || password.length < 8) return { ok: false, status: 400, message: "A new password of at least 8 characters is required." };
    const users = loadDB(DB_KEYS.USERS, []);
    const user = users.find(u => u.passwordResetToken === token && u.passwordResetExpires > Date.now());
    if (!user) return { ok: false, status: 400, message: "This password reset link is invalid or has expired." };
    user.password = password;
    user.passwordResetToken = null;
    user.passwordResetExpires = null;
    saveDB(DB_KEYS.USERS, users);
    return { ok: true, status: 200, message: "Password reset successfully. You can now log in with your new password." };
  },

  validateImages(files, isFound) {
    const MAX = 3, MAX_BYTES = 5 * 1024 * 1024, TYPES = ["image/jpeg", "image/png", "image/webp"];
    if (files.length > MAX) return "A listing can include at most 3 images.";
    for (const f of files) {
      if (!TYPES.includes(f.type)) return "Only JPEG, PNG, or WebP images are allowed.";
      if (f.size > MAX_BYTES) return "Each image must be no more than 5 MB.";
    }
    if (isFound && files.length === 0) return "Found-item listings must include at least one image.";
    return null;
  },

  createListing(data, imageDataUrls, user) {
    if (!user) return { ok: false, status: 401, message: "Authentication required." };
    if (!user.isEmailVerified) return { ok: false, status: 403, message: "Please verify your email before creating a listing." };
    if (!data.title || !data.category || !data.description || !data.date || !data.building) {
      return { ok: false, status: 400, message: "All required fields must be filled in." };
    }
    const listings = loadDB(DB_KEYS.LISTINGS, []);
    const listing = {
      id: uid("listing"), type: data.type, title: data.title, category: data.category, description: data.description,
      date: data.date, building: data.building, zone: data.zone || "", images: imageDataUrls, status: "active",
      isDeleted: false, privateDetails: data.privateDetails || "", createdBy: user.id, createdAt: Date.now(),
    };
    listings.push(listing);
    saveDB(DB_KEYS.LISTINGS, listings);
    return { ok: true, status: 201, message: "Listing created successfully.", listing };
  },

  getListings(query) {
    let listings = loadDB(DB_KEYS.LISTINGS, []).filter(l => !l.isDeleted && l.status === "active");
    const { search, type, category, building, zone, startDate, endDate } = query;
    if (type) listings = listings.filter(l => l.type === type);
    if (category) listings = listings.filter(l => l.category.toLowerCase().includes(category.toLowerCase()));
    if (building) listings = listings.filter(l => l.building.toLowerCase().includes(building.toLowerCase()));
    if (zone) listings = listings.filter(l => (l.zone || "").toLowerCase().includes(zone.toLowerCase()));
    if (startDate) listings = listings.filter(l => l.date >= startDate);
    if (endDate) listings = listings.filter(l => l.date <= endDate);
    if (search) {
      const s = search.toLowerCase();
      listings = listings.filter(l => l.title.toLowerCase().includes(s) || l.description.toLowerCase().includes(s) || l.category.toLowerCase().includes(s));
    }
    listings.sort((a, b) => b.createdAt - a.createdAt);
    const page = Math.max(parseInt(query.page || "1", 10) || 1, 1);
    const limit = Math.min(Math.max(parseInt(query.limit || "20", 10) || 20, 1), 20);
    const total = listings.length;
    const totalPages = Math.max(Math.ceil(total / limit), 1);
    const paged = listings.slice((page - 1) * limit, (page - 1) * limit + limit);
    return { total, page, limit, totalPages, listings: paged };
  },

  getListingById(id, user) {
    const listing = loadDB(DB_KEYS.LISTINGS, []).find(l => l.id === id && !l.isDeleted);
    if (!listing) return { ok: false, status: 404, message: "Listing not found." };
    const isOwner = user && listing.createdBy === user.id;
    const out = { ...listing };
    if (!isOwner) delete out.privateDetails;
    return { ok: true, status: 200, listing: out };
  },

  updateListing(id, data, newImageDataUrls, user) {
    const listings = loadDB(DB_KEYS.LISTINGS, []);
    const listing = listings.find(l => l.id === id && !l.isDeleted);
    if (!listing) return { ok: false, status: 404, message: "Listing not found." };
    if (!user || listing.createdBy !== user.id) return { ok: false, status: 403, message: "You can only edit your own listings." };
    ["title", "category", "description", "date", "building", "zone", "privateDetails"].forEach(f => {
      if (data[f] !== undefined) listing[f] = data[f];
    });
    if (newImageDataUrls && newImageDataUrls.length > 0) listing.images = newImageDataUrls;
    saveDB(DB_KEYS.LISTINGS, listings);
    return { ok: true, status: 200, message: "Listing updated successfully.", listing };
  },

  deleteListing(id, user) {
    const listings = loadDB(DB_KEYS.LISTINGS, []);
    const listing = listings.find(l => l.id === id && !l.isDeleted);
    if (!listing) return { ok: false, status: 404, message: "Listing not found." };
    if (!user || listing.createdBy !== user.id) return { ok: false, status: 403, message: "You can only delete your own listings." };
    listing.isDeleted = true;
    saveDB(DB_KEYS.LISTINGS, listings);
    return { ok: true, status: 200, message: "Listing deleted successfully." };
  },
};

/* ---------------------------- tiny hash router --------------------------- */
function currentRoute() {
  const hash = location.hash.replace(/^#/, "") || "/";
  const parts = hash.split("/").filter(Boolean);
  return { hash, parts };
}
function go(hash) { location.hash = hash; }

/* -------------------------------- rendering ------------------------------- */
function el(html) { const d = document.createElement("div"); d.innerHTML = html; return d.firstElementChild; }

function renderBanner() {
  document.getElementById("banner").innerHTML =
    `Interactive Phase 1 demo. All data shown is stored only in this browser (no real server/database). ` +
    `Produced to represent "Code Compiles and Runs" per arrangement with the course TA. ` +
    `<button class="link-button" onclick="go('/email-log')">View simulated email log</button>`;
}

function renderNav() {
  const user = Backend.currentUser();
  const nav = document.getElementById("navbar");
  nav.innerHTML = `
    <div class="nav-left">
      <a onclick="go('/')">Home</a>
      <a onclick="go('/listings')">Listings</a>
      ${user ? `<a onclick="go('/listings/new')">Create Listing</a>` : ``}
    </div>
    <div class="nav-right">
      ${user
        ? `<span class="muted">${escapeHtml(user.firstName)}</span><button onclick="doLogout()">Logout</button>`
        : `<a onclick="go('/login')">Login</a><a onclick="go('/register')">Register</a>`}
    </div>`;
}
function doLogout() { Backend.logout(); go("/listings"); render(); }

function render() {
  renderBanner();
  renderNav();
  const { parts } = currentRoute();
  const app = document.getElementById("app");
  const user = Backend.currentUser();

  const protect = (fn) => user ? fn() : (go("/login"), Pages.login());

  if (parts.length === 0) app.innerHTML = Pages.home();
  else if (parts[0] === "register") app.innerHTML = Pages.register();
  else if (parts[0] === "login") app.innerHTML = Pages.login();
  else if (parts[0] === "forgot-password") app.innerHTML = Pages.forgotPassword();
  else if (parts[0] === "reset-password" && parts[1]) app.innerHTML = Pages.resetPassword(parts[1]);
  else if (parts[0] === "verify-email" && parts[1]) app.innerHTML = Pages.verifyEmail(parts[1]);
  else if (parts[0] === "listings" && parts[1] === "new") app.innerHTML = protect(() => Pages.createListing());
  else if (parts[0] === "listings" && parts[2] === "edit") app.innerHTML = protect(() => Pages.editListing(parts[1]));
  else if (parts[0] === "listings") app.innerHTML = Pages.listings();
  else if (parts[0] === "email-log") app.innerHTML = Pages.emailLog();
  else app.innerHTML = Pages.home();

  window.scrollTo(0, 0);
}
window.go = go;
window.addEventListener("hashchange", render);

/* ---------------------------------- pages --------------------------------- */
const Pages = {};

Pages.home = () => `
  <div class="home-page">
    <h1>Lost and Found for Campus</h1>
    <p>Report lost or found items, search campus listings, and help return items to their owners.</p>
    <div class="home-actions">
      <button onclick="go('/listings')">Browse Listings</button>
      ${Backend.currentUser() ? `<button onclick="go('/listings/new')">Create Listing</button>` : ``}
    </div>
  </div>`;

Pages.emailLog = () => {
  const log = loadDB(DB_KEYS.EMAIL_LOG, []);
  return `
  <h1>Simulated Email Log</h1>
  <p class="muted">The real backend sends verification and password reset email through an authenticated SMTP provider, and falls back to logging the message to the server console when no provider is configured (see services/emailService.js). This demo has no server, so every "email" the demo sends appears here instead. Click a link below exactly as you would click it in your inbox.</p>
  ${log.length === 0 ? `<p>No emails yet. Register an account or request a password reset to see one here.</p>` : ""}
  ${log.map(e => `
    <div class="email-log entry-wrap">
      <div class="entry">
        <div><strong>To:</strong> ${escapeHtml(e.to)}</div>
        <div><strong>Subject:</strong> ${escapeHtml(e.subject)}</div>
        <div><strong>Time:</strong> ${escapeHtml(e.time)}</div>
        <div style="margin-top:6px;">${linkifyHash(escapeHtml(e.text))}</div>
      </div>
    </div>`).join("")}
  `;
};
function linkifyHash(text) {
  return text.replace(/#\/(verify-email|reset-password)\/([a-f0-9]+)/g, (m) => `<a href="${m}">${m}</a>`);
}

Pages.register = () => `
  <h1>Register</h1>
  <form onsubmit="return Handlers.register(event)">
    <label for="r-first">First Name</label>
    <input id="r-first" name="firstName">
    <label for="r-last">Last Name</label>
    <input id="r-last" name="lastName">
    <label for="r-email">UNT Email</label>
    <input id="r-email" name="email" type="email" placeholder="you@my.unt.edu">
    <label for="r-password">Password</label>
    <input id="r-password" name="password" type="password" minlength="8">
    <div id="r-error"></div>
    <button type="submit">Register</button>
  </form>`;

Pages.login = () => `
  <h1>Login</h1>
  <div id="l-notice"></div>
  <form onsubmit="return Handlers.login(event)">
    <label for="l-email">Email</label>
    <input id="l-email" name="email" type="email">
    <label for="l-password">Password</label>
    <input id="l-password" name="password" type="password">
    <div id="l-error"></div>
    <button type="submit">Login</button>
  </form>
  <p><a onclick="go('/forgot-password')" style="cursor:pointer;">Forgot your password?</a></p>
  <p class="muted">Demo seed account: jordan.ellis@my.unt.edu / Password123</p>`;

Pages.forgotPassword = () => `
  <h1>Forgot Password</h1>
  <div id="fp-result"></div>
  <form id="fp-form" onsubmit="return Handlers.forgotPassword(event)">
    <label for="fp-email">Email</label>
    <input id="fp-email" name="email" type="email">
    <button type="submit">Send Reset Link</button>
  </form>
  <p><a onclick="go('/login')" style="cursor:pointer;">Back to login</a></p>`;

Pages.resetPassword = (token) => `
  <h1>Reset Password</h1>
  <form onsubmit="return Handlers.resetPassword(event, '${token}')">
    <label for="rp-password">New Password</label>
    <input id="rp-password" name="password" type="password" minlength="8">
    <label for="rp-confirm">Confirm New Password</label>
    <input id="rp-confirm" name="confirm" type="password" minlength="8">
    <div id="rp-error"></div>
    <button type="submit">Reset Password</button>
  </form>
  <p><a onclick="go('/login')" style="cursor:pointer;">Back to login</a></p>`;

Pages.verifyEmail = (token) => {
  const result = Backend.verifyEmail(token);
  return `
  <h1>Email Verification</h1>
  <p class="${result.ok ? "" : "form-message error"}">${escapeHtml(result.message)}</p>
  <p><a onclick="go('/login')" style="cursor:pointer;">Go to login</a></p>`;
};

Pages.listings = () => {
  const q = window.__listingsQuery || { page: 1 };
  const result = Backend.getListings(q);
  const user = Backend.currentUser();
  return `
  <h1>Listings</h1>
  <form onsubmit="return Handlers.search(event)">
    <label for="s-search">Search</label>
    <input id="s-search" value="${escapeHtml(q.search || "")}" placeholder="Search listings">
    <label for="s-type">Type</label>
    <select id="s-type">
      <option value="" ${!q.type ? "selected" : ""}>All</option>
      <option value="lost" ${q.type === "lost" ? "selected" : ""}>Lost</option>
      <option value="found" ${q.type === "found" ? "selected" : ""}>Found</option>
    </select>
    <label for="s-category">Category</label>
    <input id="s-category" value="${escapeHtml(q.category || "")}" placeholder="Example: Bags">
    <label for="s-building">Building</label>
    <input id="s-building" value="${escapeHtml(q.building || "")}" placeholder="Example: Willis Library">
    <label for="s-zone">Zone</label>
    <input id="s-zone" value="${escapeHtml(q.zone || "")}" placeholder="Example: North Campus">
    <label for="s-start">Date From</label>
    <input id="s-start" type="date" value="${escapeHtml(q.startDate || "")}">
    <label for="s-end">Date To</label>
    <input id="s-end" type="date" value="${escapeHtml(q.endDate || "")}">
    <div>
      <button type="submit">Search</button>
      <button type="button" onclick="Handlers.clearSearch()">Clear</button>
    </div>
  </form>
  <hr>
  ${result.listings.length === 0 ? `<p>No active listings found.</p>` : ""}
  ${result.listings.map(l => `
    <div class="listing-card">
      <h2>${escapeHtml(l.title)}</h2>
      ${l.images.length ? `<div class="listing-images">${l.images.map(src => `<img class="listing-thumbnail" src="${src}">`).join("")}</div>` : ""}
      <p><strong>Type:</strong> ${escapeHtml(l.type)}</p>
      <p><strong>Category:</strong> ${escapeHtml(l.category)}</p>
      <p><strong>Description:</strong> ${escapeHtml(l.description)}</p>
      <p><strong>Location:</strong> ${escapeHtml(l.building || "Not specified")}${l.zone ? ", " + escapeHtml(l.zone) : ""}</p>
      ${user && user.id === l.createdBy ? `
        <div>
          <button onclick="go('/listings/${l.id}/edit')">Edit</button>
          <button onclick="Handlers.deleteListing('${l.id}')">Delete</button>
        </div>` : ""}
    </div>`).join("")}
  <div class="pagination">
    <button ${result.page <= 1 ? "disabled" : ""} onclick="Handlers.gotoPage(${result.page - 1})">Previous</button>
    <span>Page ${result.page} of ${result.totalPages}</span>
    <button ${result.page >= result.totalPages ? "disabled" : ""} onclick="Handlers.gotoPage(${result.page + 1})">Next</button>
  </div>`;
};

Pages.createListing = () => `
  <h1>Create Listing</h1>
  <form id="cl-form" onsubmit="return Handlers.createListing(event)">
    <label for="cl-type">Type</label>
    <select id="cl-type" onchange="Handlers.toggleFoundHint()">
      <option value="lost">Lost</option>
      <option value="found">Found</option>
    </select>
    <label for="cl-title">Title</label>
    <input id="cl-title">
    <label for="cl-category">Category</label>
    <input id="cl-category">
    <label for="cl-description">Description</label>
    <textarea id="cl-description"></textarea>
    <label for="cl-date">Date</label>
    <input id="cl-date" type="date">
    <label for="cl-building">Building</label>
    <input id="cl-building">
    <label for="cl-zone">Zone (optional)</label>
    <input id="cl-zone">
    <label for="cl-images" id="cl-images-label">Photos (optional)</label>
    <input id="cl-images" type="file" accept="image/jpeg,image/png,image/webp" multiple>
    <p class="helper-text">Up to 3 images, JPEG/PNG/WebP, 5 MB each.</p>
    <label for="cl-private">Private Identifying Details (Found items only, never shown publicly)</label>
    <textarea id="cl-private"></textarea>
    <div id="cl-error"></div>
    <button type="submit">Create Listing</button>
  </form>`;

Pages.editListing = (id) => {
  const user = Backend.currentUser();
  const result = Backend.getListingById(id, user);
  if (!result.ok) return `<h1>Edit Listing</h1><p class="form-message error">${escapeHtml(result.message)}</p>`;
  const l = result.listing;
  if (l.createdBy !== user.id) return `<h1>Edit Listing</h1><p class="form-message error">You can only edit your own listings.</p>`;
  return `
  <h1>Edit Listing</h1>
  <form onsubmit="return Handlers.editListing(event, '${id}')">
    <label for="el-title">Title</label>
    <input id="el-title" value="${escapeHtml(l.title)}">
    <label for="el-category">Category</label>
    <input id="el-category" value="${escapeHtml(l.category)}">
    <label for="el-description">Description</label>
    <textarea id="el-description">${escapeHtml(l.description)}</textarea>
    <label for="el-date">Date</label>
    <input id="el-date" type="date" value="${escapeHtml(l.date)}">
    <label for="el-building">Building</label>
    <input id="el-building" value="${escapeHtml(l.building)}">
    <label for="el-zone">Zone</label>
    <input id="el-zone" value="${escapeHtml(l.zone || "")}">
    <label for="el-images">Replace Photos (optional)</label>
    <input id="el-images" type="file" accept="image/jpeg,image/png,image/webp" multiple>
    <p class="helper-text">Leave empty to keep the current photos. Up to 3 images, JPEG/PNG/WebP, 5 MB each.</p>
    <label for="el-private">Private Identifying Details</label>
    <textarea id="el-private">${escapeHtml(l.privateDetails || "")}</textarea>
    <div id="el-error"></div>
    <button type="submit">Save Changes</button>
  </form>`;
};

/* -------------------------------- handlers -------------------------------- */
const Handlers = {};

function filesToDataUrls(fileList) {
  const files = Array.from(fileList || []);
  return Promise.all(files.map(f => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(f);
  }))).then(urls => ({ files, urls }));
}

Handlers.register = (e) => {
  e.preventDefault();
  const data = {
    firstName: document.getElementById("r-first").value.trim(),
    lastName: document.getElementById("r-last").value.trim(),
    email: document.getElementById("r-email").value.trim(),
    password: document.getElementById("r-password").value,
  };
  const result = Backend.register(data);
  const box = document.getElementById("r-error");
  if (!result.ok) { box.innerHTML = `<p class="field-error">${escapeHtml(result.message)}</p>`; return false; }
  go("/login");
  render();
  document.getElementById("l-notice").innerHTML = `<p>${escapeHtml(result.message)}</p>`;
  return false;
};

Handlers.login = (e) => {
  e.preventDefault();
  const data = { email: document.getElementById("l-email").value.trim(), password: document.getElementById("l-password").value };
  const result = Backend.login(data);
  const box = document.getElementById("l-error");
  if (!result.ok) { box.innerHTML = `<p class="field-error">${escapeHtml(result.message)}</p>`; return false; }
  go("/listings");
  render();
  return false;
};

Handlers.forgotPassword = (e) => {
  e.preventDefault();
  const email = document.getElementById("fp-email").value.trim();
  const result = Backend.forgotPassword({ email });
  document.getElementById("fp-result").innerHTML = `<p>${escapeHtml(result.message)}</p>`;
  const form = document.getElementById("fp-form");
  if (result.ok) form.style.display = "none";
  return false;
};

Handlers.resetPassword = (e, token) => {
  e.preventDefault();
  const password = document.getElementById("rp-password").value;
  const confirm = document.getElementById("rp-confirm").value;
  const box = document.getElementById("rp-error");
  if (password !== confirm) { box.innerHTML = `<p class="field-error">Passwords do not match.</p>`; return false; }
  const result = Backend.resetPassword(token, { password });
  if (!result.ok) { box.innerHTML = `<p class="field-error">${escapeHtml(result.message)}</p>`; return false; }
  go("/login");
  render();
  document.getElementById("l-notice").innerHTML = `<p>${escapeHtml(result.message)}</p>`;
  return false;
};

Handlers.toggleFoundHint = () => {
  const isFound = document.getElementById("cl-type").value === "found";
  document.getElementById("cl-images-label").textContent = isFound ? "Photos (at least 1 required)" : "Photos (optional)";
};

Handlers.createListing = (e) => {
  e.preventDefault();
  const type = document.getElementById("cl-type").value;
  const fileInput = document.getElementById("cl-images");
  const box = document.getElementById("cl-error");
  const imgError = Backend.validateImages(fileInput.files, type === "found");
  if (imgError) { box.innerHTML = `<p class="field-error">${escapeHtml(imgError)}</p>`; return false; }
  filesToDataUrls(fileInput.files).then(({ urls }) => {
    const data = {
      type,
      title: document.getElementById("cl-title").value.trim(),
      category: document.getElementById("cl-category").value.trim(),
      description: document.getElementById("cl-description").value.trim(),
      date: document.getElementById("cl-date").value,
      building: document.getElementById("cl-building").value.trim(),
      zone: document.getElementById("cl-zone").value.trim(),
      privateDetails: document.getElementById("cl-private").value.trim(),
    };
    const result = Backend.createListing(data, urls, Backend.currentUser());
    if (!result.ok) { box.innerHTML = `<p class="field-error">${escapeHtml(result.message)}</p>`; return; }
    go("/listings");
    render();
  });
  return false;
};

Handlers.editListing = (e, id) => {
  e.preventDefault();
  const fileInput = document.getElementById("el-images");
  const box = document.getElementById("el-error");
  const imgError = fileInput.files.length ? Backend.validateImages(fileInput.files, false) : null;
  if (imgError) { box.innerHTML = `<p class="field-error">${escapeHtml(imgError)}</p>`; return false; }
  filesToDataUrls(fileInput.files).then(({ urls }) => {
    const data = {
      title: document.getElementById("el-title").value.trim(),
      category: document.getElementById("el-category").value.trim(),
      description: document.getElementById("el-description").value.trim(),
      date: document.getElementById("el-date").value,
      building: document.getElementById("el-building").value.trim(),
      zone: document.getElementById("el-zone").value.trim(),
      privateDetails: document.getElementById("el-private").value.trim(),
    };
    const result = Backend.updateListing(id, data, urls, Backend.currentUser());
    if (!result.ok) { box.innerHTML = `<p class="field-error">${escapeHtml(result.message)}</p>`; return; }
    go("/listings");
    render();
  });
  return false;
};

Handlers.deleteListing = (id) => {
  if (!confirm("Are you sure you want to delete this listing?")) return;
  const result = Backend.deleteListing(id, Backend.currentUser());
  if (!result.ok) alert(result.message);
  render();
};

Handlers.search = (e) => {
  e.preventDefault();
  window.__listingsQuery = {
    search: document.getElementById("s-search").value.trim(),
    type: document.getElementById("s-type").value,
    category: document.getElementById("s-category").value.trim(),
    building: document.getElementById("s-building").value.trim(),
    zone: document.getElementById("s-zone").value.trim(),
    startDate: document.getElementById("s-start").value,
    endDate: document.getElementById("s-end").value,
    page: 1,
  };
  render();
  return false;
};
Handlers.clearSearch = () => { window.__listingsQuery = { page: 1 }; render(); };
Handlers.gotoPage = (page) => { window.__listingsQuery = { ...(window.__listingsQuery || {}), page }; render(); };

/* ------------------------------------------------------------------------ */
render();
</script>
</body>
</html>
