name: Build and deploy to Azure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: lfcampus-api-s2iv1
  AZURE_RESOURCE_GROUP: rg-lostfound-falcons

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Throwaway password for the disposable CI container only (not a real credential).
          MSSQL_SA_PASSWORD: Ci-Only-Test-Pass-1!
        ports:
          - 1433:1433
    env:
      NODE_ENV: test
      DB_AUTH: sql
      DB_SERVER: localhost
      DB_USER: sa
      DB_PASSWORD: Ci-Only-Test-Pass-1!
      DB_NAME: lostfound
      DB_NAME_TEST: lostfound_test
      DB_TRUST_CERT: "true"
      JWT_SECRET: ci-only-jwt-secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: src/backend
        run: pnpm install --frozen-lockfile
      - name: Create test database
        working-directory: src/backend
        run: node scripts/ci-create-test-db.js
      - name: Run backend tests
        working-directory: src/backend
        run: pnpm test

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build client
        working-directory: src/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build

      - name: Stage API and client
        run: |
          mkdir stage
          rsync -a --exclude node_modules --exclude tests --exclude scripts --exclude .env \
            --exclude .local-storage --exclude pnpm-workspace.yaml src/backend/ stage/
          cp -r src/frontend/dist stage/public
          (cd stage && zip -qr ../deploy.zip .)

      - uses: actions/upload-artifact@v7
        with:
          name: deploy-package
          path: deploy.zip

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: deploy-package

      # Federated (OIDC) sign-in: no secrets are stored, only these three ids
      # configured as repository variables or secrets.
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # App Service runs the remote build (npm install) during zip deploy.
      - name: Deploy
        run: |
          az webapp deploy --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" \
            --src-path deploy.zip --type zip --clean true --async true
